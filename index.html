<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Theo's Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pastel-pink: #ffd1dc;
            --pastel-purple: #e2d1f9;
            --deep-purple: #b39cd0;
            --text: #333333;
            --error-red: #ff8b8b;
            --heart-pink: #ff6b9d;
            --wood-brown: #8d6e63;
            
            --morning-sky: linear-gradient(to bottom, #ff9e80, #fdf5e6);
            --day-sky: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            --sunset-sky: linear-gradient(to bottom, #ff7e5f, #feb47b);
            --night-sky: linear-gradient(to bottom, #1a1a2e, #16213e);
            --bday-sky: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            
            --glass: rgba(255, 255, 255, 0.85);
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-purple));
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        #heart-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            font-size: 2.2rem;
            color: var(--heart-pink);
            opacity: 0; 
            transition: opacity 1s ease;
            animation: heartFloat 12s infinite linear;
        }

        @keyframes heartFloat {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); }
            50% { transform: translateY(-150px) rotate(20deg) scale(1.1); }
            100% { transform: translateY(-300px) rotate(-10deg) scale(0.9); }
        }

        /* Responsive Side Panels Setup */
        #reward-shelf {
            position: fixed;
            right: 25px;
            top: 25px;
            width: 240px;
            max-height: 300px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 20px 15px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            z-index: 100;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        #reward-shelf::-webkit-scrollbar { width: 5px; }
        #reward-shelf::-webkit-scrollbar-thumb { background: var(--deep-purple); border-radius: 10px; }

        .shelf-title { font-size: 0.85rem; font-weight: 900; margin-bottom: 15px; color: var(--deep-purple); text-align: center; text-transform: uppercase; letter-spacing: 1.5px; }

        .claimed-item {
            background: white;
            padding: 12px 15px;
            border-radius: 18px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #pet-garden-diorama {
            position: fixed;
            left: 3%;
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            height: 340px;
            background: var(--day-sky);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 4px solid white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 15px;
            z-index: 10;
            box-shadow: 0 20px 45px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: background 2s ease;
        }

        .vines {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            opacity: 0.8;
        }

        .vine-stem {
            width: 2px;
            height: 60px;
            background: #8dad94;
            position: relative;
            transform: rotate(-15deg);
            border-radius: 2px;
        }

        .leaf {
            position: absolute;
            width: 12px;
            height: 20px;
            background: #a8d5ba;
            border-radius: 0 100% 0 100%;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.05);
        }

        .leaf:nth-child(1) { top: 5px; left: 2px; transform: rotate(45deg); }
        .leaf:nth-child(2) { top: 20px; left: -12px; transform: rotate(-135deg); background: #9bc7ab; }
        .leaf:nth-child(3) { top: 35px; left: 2px; transform: rotate(45deg); }
        .leaf:nth-child(4) { top: 50px; left: -12px; transform: rotate(-135deg); width: 8px; height: 14px; }

        #pet-garden-diorama::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: #d4edda;
            border-radius: 0 0 46px 46px;
            z-index: 1;
        }

        .fence {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 30px;
            background-image: linear-gradient(to right, white 10px, transparent 10px);
            background-size: 20px 100%;
            z-index: 1;
            opacity: 0.5;
        }

        .pet-avatar {
            font-size: 6rem;
            z-index: 2;
            animation: petIdle 3s infinite ease-in-out;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .pet-avatar.eating { transform: scale(1.3); }

        .nameplate-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .nameplate-cord {
            width: 50px;
            height: 10px;
            border: 2px solid var(--wood-brown);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            margin-bottom: -2px;
            opacity: 0.6;
        }

        .hapu-sign {
            background: #fdf5e6;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--wood-brown);
            border: 3px solid var(--wood-brown);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transform: rotate(-1deg);
            transition: transform 0.2s ease;
        }

        .nameplate-container:active .hapu-sign {
            transform: rotate(2deg) scale(1.05);
        }

        .pet-bubble {
            background: white;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 4;
            text-align: center;
            min-width: 140px;
            position: relative;
        }
        .pet-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }

        .falling-treat {
            position: absolute;
            top: -40px;
            font-size: 1.5rem;
            z-index: 3;
            animation: treatDrop 0.8s forwards ease-in;
        }

        @keyframes treatDrop {
            0% { transform: translateY(0); opacity: 1; }
            80% { transform: translateY(180px); opacity: 1; }
            100% { transform: translateY(180px); opacity: 0; }
        }

        @keyframes petIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            z-index: 1;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }

        .bday-accessory {
            position: absolute;
            font-size: 2.5rem;
            bottom: 55px;
            right: 20px;
            z-index: 3;
        }

        /* Fully Responsive Grid Layouts */
        .goal-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .goal-item {
            background: white;
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 22px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 2px solid transparent;
            word-break: break-word;
        }

        .goal-item:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.15); border-color: var(--pastel-pink); }
        .goal-item.completed { background: var(--pastel-purple); color: var(--deep-purple); text-decoration: line-through; border: 2px solid white; }

        .delete-goal {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--error-red);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            opacity: 0;
            transition: 0.2s;
            font-weight: 900;
        }
        .goal-item:hover .delete-goal { opacity: 1; }

        .header-nav { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; background: white; padding: 15px 35px; border-radius: 60px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.05); }
        .month-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--deep-purple); font-weight: 900; transition: 0.2s; }
        .month-btn:hover { transform: scale(1.2); }
        #currentMonthDisplay { font-weight: 800; min-width: 160px; text-align: center; font-size: 1.2rem; }

        .points-display { background: white; padding: 20px 60px; border-radius: 35px; font-size: 2.8rem; font-weight: 900; box-shadow: 0 15px 45px rgba(179, 156, 208, 0.5); margin-bottom: 40px; color: var(--deep-purple); border: 5px solid white; }

        .reward-container { width: 100%; max-width: 420px; margin-top: 20px; }
        .reward-card { background: white; border-radius: 45px; padding: 50px 30px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.15); border: 4px solid var(--pastel-purple); position: relative; }
        .reward-card.locked { opacity: 0.8; filter: grayscale(0.2); }
        .reward-name-large { font-size: 1.8rem; font-weight: 800; filter: blur(14px); transition: filter 1.2s ease; margin-bottom: 25px; color: var(--text); }
        .reward-name-large.revealed { filter: blur(0); }
        .cost-badge { font-size: 1rem; font-weight: 900; background: var(--pastel-pink); padding: 12px 30px; border-radius: 60px; display: inline-block; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .claim-zone { 
            margin: 35px auto 10px; 
            width: 100px; 
            height: 100px; 
            background: #fdfdfd; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            position: relative; 
            overflow: hidden; 
            border: 6px solid #f0f0f0; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .reward-card.active-reward .claim-zone { border-color: var(--deep-purple); }
        .progress-ring { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--deep-purple); }

        #goalInput {
            flex: 1; 
            padding: 20px; 
            border-radius: 25px; 
            border: 2px solid white; 
            outline: none; 
            box-shadow: var(--shadow); 
            font-size: 1rem;
            font-weight: 600;
        }

        @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- MOBILE & TABLET MEDIA QUERIES --- */
        @media (max-width: 1200px) {
            /* Unlock Layout flow from being absolutely pinned to the window */
            #pet-garden-diorama, #reward-shelf {
                position: static;
                transform: none;
                margin-bottom: 25px;
            }

            body {
                padding-top: 20px;
            }

            /* Stack sections vertically instead of dropping them off screen */
            #reward-shelf {
                width: 100%;
                max-width: 500px;
                max-height: 200px;
                order: 6; /* Send history towards the bottom */
            }

            #pet-garden-diorama {
                width: 100%;
                max-width: 340px;
                height: 260px;
                order: 1; /* Keep Theo visible at the top */
                flex-direction: row;
                padding: 15px;
                border-radius: 35px;
            }

            #pet-garden-diorama::after {
                height: 50px;
                border-radius: 0 0 31px 31px;
            }

            .fence {
                bottom: 40px;
            }

            .bday-accessory {
                bottom: 35px;
            }

            .pet-avatar {
                font-size: 4.5rem;
            }

            .pet-bubble {
                min-width: 110px;
                padding: 8px 12px;
                font-size: 0.75rem;
            }

            .pet-bubble::after {
                bottom: auto;
                left: -10px;
                top: 50%;
                transform: translateY(-50%);
                border-top: 10px solid transparent;
                border-bottom: 10px solid transparent;
                border-right: 10px solid white;
                border-left: none;
            }

            .goal-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns on tablets */
                gap: 15px;
            }
        }

        @media (max-width: 600px) {
            .goal-grid {
                grid-template-columns: 1fr; /* 1 neat column on small phone screens */
            }
            
            .goal-item {
                aspect-ratio: auto; /* Allow items to stretch based on text length instead of forcing circles */
                border-radius: 20px;
                padding: 20px 40px 20px 20px;
                text-align: left;
                justify-content: flex-start;
            }

            .delete-goal {
                opacity: 1; /* Make delete button visible on mobile touch instantly */
                top: 50%;
                right: 15px;
                transform: translateY(-50%);
            }

            .points-display {
                font-size: 2rem;
                padding: 15px 40px;
            }

            .header-nav {
                padding: 10px 20px;
                width: 100%;
                max-width: 320px;
                justify-content: space-between;
            }

            #currentMonthDisplay {
                min-width: auto;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="heart-background"></div>

    <!-- Theo Pet Diorama Container -->
    <div id="pet-garden-diorama">
        <div class="vines">
            <div class="vine-stem">
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
            </div>
        </div>
        <div id="sky-effects" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
        <div class="pet-bubble" id="pet-speech">Hi Hapu! 🐾</div>
        <div id="treat-container" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
        <div class="pet-avatar" id="pet-emoji" onclick="pokePet()">🐶</div>
        <div id="bday-cake" class="bday-accessory"></div>
        <div class="fence"></div>
        <div class="nameplate-container">
            <div class="nameplate-cord"></div>
            <div class="hapu-sign">Theo</div>
        </div>
    </div>

    <!-- Header Navigation Section -->
    <div class="header-nav">
        <button class="month-btn" onclick="changeMonth(-1)">❮</button>
        <div id="currentMonthDisplay">...</div>
        <button class="month-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <!-- Tracker Point Counter Box -->
    <div class="points-display" id="points">0 PTS</div>

    <!-- Goal Dashboard Space -->
    <div class="goal-grid" id="goalGrid"></div>

    <!-- Goal Submission Input Area -->
    <div style="margin-bottom: 40px; display: flex; gap: 15px; width: 100%; max-width: 500px;">
        <input type="text" id="goalInput" placeholder="Add a goal for Hapu..." onkeypress="if(event.key==='Enter')addGoal()">
        <button onclick="addGoal()" style="background:var(--deep-purple); color:white; border:none; padding:0 25px; border-radius:25px; cursor:pointer; font-weight:800; font-size:1.6rem; box-shadow: var(--shadow);">+</button>
    </div>

    <!-- Reward Showcase Container -->
    <div class="reward-container" id="rewardContainer"></div>

    <!-- Reward Claims Log Space -->
    <div id="reward-shelf">
        <div class="shelf-title">💝 Reward History</div>
        <div id="shelf-list"></div>
    </div>

    <!-- System Control Management Panel -->
    <div style="margin-top: 60px; margin-bottom: 40px; order: 10;">
        <button onclick="resetThisMonth()" style="background:white; border:1px solid rgba(0,0,0,0.1); padding:12px 24px; border-radius:15px; cursor:pointer; font-size:0.8rem; font-weight:800; color: #777; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">RESET MONTHLY PROGRESS</button>
    </div>

    <script>
        let currentDate = new Date();
        let allData = JSON.parse(localStorage.getItem('trackerDataV14')) || {};
        let redeemedSet = JSON.parse(localStorage.getItem('redeemedListV14')) || [];
        
        let progressInterval;
        let currentProgress = 0;
        let isPetEating = false;

        function setupBackground() {
            const heartBg = document.getElementById('heart-background');
            heartBg.innerHTML = "";
            const isSeptember = currentDate.getMonth() === 8;
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerText = isSeptember ? '🎈' : '♥';
                heart.id = `heart-${i}`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 10}s`;
                heartBg.appendChild(heart);
            }
        }

        const seasonalRewards = {
            3: [
                { id: 'pat', name: "Pat on the head", cost: 20 },
                { id: 'hug', name: "Warm Hug", cost: 40 },
                { id: 'kiss', name: "A Kiss", cost: 60 },
                { id: 'gift', name: "Small Gift", cost: 80 },
                { id: 'rice', name: "Seafood Rice Supper", cost: 100 }
            ],
            8: [
                { id: 'bday1', name: "Birthday Surprise", cost: 20 },
                { id: 'bday2', name: "Special Birthday Hug", cost: 40 },
                { id: 'bday3', name: "Cake Date", cost: 60 },
                { id: 'bday4', name: "Birthday Present", cost: 80 },
                { id: 'bday5', name: "Birthday Dinner Party", cost: 100 }
            ],
            default: [
                { id: 'msg', name: "Sweet Message", cost: 20 },
                { id: 'coffee', name: "Coffee Date", cost: 40 },
                { id: 'rub', name: "Foot Rub", cost: 60 },
                { id: 'snack', name: "Surprise Snack", cost: 80 },
                { id: 'shop', name: "Shopping Trip", cost: 100 }
            ]
        };

        function getMonthKey() { return `${currentDate.getMonth()}-${currentDate.getFullYear()}`; }
        function getRewardsForMonth() { return seasonalRewards[currentDate.getMonth()] || seasonalRewards.default; }

        function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); setupBackground(); render(); }

        function addGoal() {
            const input = document.getElementById('goalInput');
            if (!input.value.trim()) return;
            const key = getMonthKey();
            if (!allData[key]) allData[key] = [];
            allData[key].push({ id: Date.now(), text: input.value, done: false });
            input.value = ""; save();
        }

        function toggleGoal(id) {
            const key = getMonthKey();
            let goalJustFinished = false;
            allData[key] = allData[key].map(g => {
                if (g.id === id) {
                    if (!g.done) goalJustFinished = true;
                    return {...g, done: !g.done};
                }
                return g;
            });
            if (goalJustFinished) feedPet();
            save();
        }

        function deleteGoal(e, id) {
            e.stopPropagation();
            const key = getMonthKey();
            allData[key] = allData[key].filter(g => g.id !== id);
            save();
        }

        function pokePet() {
            const speech = document.getElementById('pet-speech');
            const original = speech.innerText;
            const isSeptember = currentDate.getMonth() === 8;
            speech.innerText = isSeptember ? "Happy Birthday Hapu! 🎂" : "Hapu is my favorite! 🦴";
            setTimeout(() => { speech.innerText = original; }, 2000);
        }

        function feedPet() {
            if (isPetEating) return;
            isPetEating = true;
            const container = document.getElementById('treat-container');
            const bone = document.createElement('div');
            bone.className = 'falling-treat';
            bone.innerText = '🦴';
            bone.style.left = '50%';
            bone.style.transform = 'translateX(-50%)';
            container.appendChild(bone);
            
            const emoji = document.getElementById('pet-emoji');
            const speech = document.getElementById('pet-speech');

            setTimeout(() => {
                bone.remove();
                emoji.classList.add('eating');
                speech.innerText = "Yum! Good job Hapu!";
                
                for (let i = 0; i < 30; i++) {
                    const h = document.getElementById(`heart-${i}`);
                    if(h) {
                        h.style.transition = "opacity 0.3s";
                        h.style.opacity = "1";
                    }
                }

                setTimeout(() => {
                    emoji.classList.remove('eating');
                    isPetEating = false;
                    updateAtmosphere(parseInt(document.getElementById('points').innerText));
                }, 3000); 
            }, 800);
        }

        function updateAtmosphere(pts) {
            if (isPetEating) return;
            const emoji = document.getElementById('pet-emoji');
            const speech = document.getElementById('pet-speech');
            const diorama = document.getElementById('pet-garden-diorama');
            const skyEffects = document.getElementById('sky-effects');
            const bdayCake = document.getElementById('bday-cake');
            
            const hour = new Date().getHours();
            const isSeptember = currentDate.getMonth() === 8;

            skyEffects.innerHTML = ""; 
            bdayCake.innerText = isSeptember ? "🎂" : "";

            if (isSeptember) {
                diorama.style.background = "var(--bday-sky)";
            } 
            else if (hour >= 6 && hour < 12) {
                diorama.style.background = "var(--morning-sky)";
            } 
            else if (hour >= 12 && hour < 16) {
                diorama.style.background = "var(--day-sky)";
            } 
            else if (hour >= 16 && hour < 18) {
                diorama.style.background = "var(--sunset-sky)";
            } 
            else {
                diorama.style.background = "var(--night-sky)";
                for(let i=0; i<15; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.width = star.style.height = Math.random() * 3 + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 70 + '%';
                    star.style.animationDelay = Math.random() * 2 + 's';
                    skyEffects.appendChild(star);
                }
            }

            emoji.innerText = "🐶";

            if (hour >= 22 || hour < 6) {
                speech.innerText = "Goodnight, Hapu... zzz";
            } else {
                if (pts === 0) { speech.innerText = "Waiting for Hapu... ✨"; }
                else if (pts < 60) { speech.innerText = "Good job Hapu! 🌟"; }
                else if (pts < 100) { speech.innerText = "Hapu is amazing! 🔥"; }
                else { speech.innerText = "Theo loves Hapu! 💝"; }
                
                if (isSeptember && pts >= 100) speech.innerText = "Best Birthday Ever! 🎉";
            }

            const activeHearts = Math.floor((pts / 100) * 30);
            for (let i = 0; i < 30; i++) {
                const h = document.getElementById(`heart-${i}`);
                if(h) h.style.opacity = (i < activeHearts) ? "0.6" : "0";
            }
        }

        function startHold(id, possible, event) {
            if (!possible) return;
            if (event && event.cancelable) event.preventDefault(); // Stop text selection context menu on mobile long-tap
            
            const ring = document.querySelector('.progress-ring');
            currentProgress = 0;
            clearInterval(progressInterval);
            
            progressInterval = setInterval(() => {
                currentProgress += 2;
                if (ring) ring.style.height = currentProgress + '%';
                if (currentProgress >= 100) { clearInterval(progressInterval); redeem(id); }
            }, 20);
        }

        function endHold() {
            clearInterval(progressInterval);
            currentProgress = 0;
            const ring = document.querySelector('.progress-ring');
            if (ring) ring.style.height = '0%';
        }

        function redeem(id) {
            const key = getMonthKey();
            const nameEl = document.getElementById('activeRewardName');
            
            if (nameEl) nameEl.classList.add('revealed');
            confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 }, colors: ['#ff6b9d', '#ffd1dc', '#ffffff'] });
            
            setTimeout(() => {
                redeemedSet.push(id + key);
                save();
            }, 2500);
        }

        function resetThisMonth() {
            if (confirm(`Reset Hapu's progress?`)) {
                const key = getMonthKey();
                delete allData[key];
                redeemedSet = redeemedSet.filter(item => !item.endsWith(key));
                save();
            }
        }

        function save() {
            localStorage.setItem('trackerDataV14', JSON.stringify(allData));
            localStorage.setItem('redeemedListV14', JSON.stringify(redeemedSet));
            render();
        }

        function render() {
            const key = getMonthKey();
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('currentMonthDisplay').innerText = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            const currentGoals = allData[key] || [];
            const currentPoints = currentGoals.filter(g => g.done).length * 20;
            document.getElementById('points').innerText = `${currentPoints} PTS`;
            updateAtmosphere(currentPoints);
            const grid = document.getElementById('goalGrid');
            grid.innerHTML = "";
            currentGoals.forEach(g => {
                const item = document.createElement('div');
                item.className = `goal-item ${g.done ? 'completed' : ''}`;
                item.innerHTML = `<span class="delete-goal" onclick="deleteGoal(event, ${g.id})">✕</span>${g.text}`;
                item.onclick = () => toggleGoal(g.id);
                grid.appendChild(item);
            });
            const rewards = getRewardsForMonth();
            const shelfList = document.getElementById('shelf-list');
            shelfList.innerHTML = "";
            redeemedSet.forEach(rKey => {
                if(rKey.endsWith(key)) {
                    const rId = rKey.replace(key, "");
                    const rObj = rewards.find(x => x.id === rId);
                    if(rObj) {
                        const div = document.createElement('div');
                        div.className = "claimed-item";
                        div.innerHTML = `🎁 ${rObj.name}`;
                        shelfList.appendChild(div);
                    }
                }
            });
            let activeReward = rewards.find(r => !redeemedSet.includes(r.id + key));
            const container = document.getElementById('rewardContainer');
            if (!activeReward) {
                container.innerHTML = `<div class="reward-card"><div class="reward-name-large revealed">Month Complete! 🏆</div></div>`;
                return;
            }
            const canAfford = currentPoints >= activeReward.cost;
            container.innerHTML = `
                <div class="reward-card ${canAfford ? 'active-reward' : 'locked'}">
                    <div class="reward-name-large" id="activeRewardName">${activeReward.name}</div>
                    <div class="cost-badge">${activeReward.cost} PTS REQUIRED</div>
                    <div class="claim-zone" 
                        onmousedown="startHold('${activeReward.id}', ${canAfford}, event)" 
                        onmouseup="endHold()" 
                        onmouseleave="endHold()"
                        ontouchstart="startHold('${activeReward.id}', ${canAfford}, event)" 
                        ontouchend="endHold()">
                        <div class="progress-ring"></div>
                        <span style="position:relative; z-index:2; font-size:2rem;">${canAfford ? '🔓' : '🔒'}</span>
                    </div>
                </div>`;
        }
        setupBackground();
        render();
    </script>
</body>
</html>
